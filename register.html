<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevBlog - Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Dev<span>Blog</span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                ✨
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join the DevBlog community
            </p>

        </div>


        <form id="registerForm">

            <div class="input-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary-btn full-width">

                Create Account

            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
