<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevBlog - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Dev<span>Blog</span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="create-blog.html">
            Create Blog
        </a>

        <button
            id="logoutButton"
            class="logout-btn">

            Logout

        </button>

    </nav>

</header>


<main class="dashboard">

    <!-- WELCOME -->

    <section class="dashboard-header">

        <div>

            <span class="section-label">
                DASHBOARD
            </span>

            <h1 id="welcomeMessage">
                Welcome
            </h1>

            <p>
                Manage your blogs from here.
            </p>

        </div>


        <a
            href="create-blog.html"
            class="btn primary-btn">

            + Create Blog

        </a>

    </section>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📝
            </div>

            <div>

                <span>
                    My Blogs
                </span>

                <h2 id="totalBlogs">
                    0
                </h2>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👤
            </div>

            <div>

                <span>
                    Account
                </span>

                <h2>
                    Active
                </h2>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🚀
            </div>

            <div>

                <span>
                    Platform
                </span>

                <h2>
                    DevBlog
                </h2>

            </div>

        </div>

    </section>


    <!-- BLOGS -->

    <section class="dashboard-content">

        <div class="section-title left">

            <span>
                YOUR CONTENT
            </span>

            <h2>
                My Blogs
            </h2>

        </div>


        <div
            id="dashboardBlogs"
            class="blog-grid">

        </div>

    </section>

</main>


<script src="js/app.js"></script>

</body>
</html>
