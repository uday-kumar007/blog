<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevBlog - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Dev<span>Blog</span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your DevBlog account
            </p>

        </div>


        <form id="loginForm">

            <div class="input-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary-btn full-width">

                Login

            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
